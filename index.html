<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d1a12">
<title>OPSROOM TB — Kawal Wabak</title>
<style>
:root{
  --bg:#0d1a12; --panel:#12241a; --panel2:#17301f; --border:#2b4a33;
  --ink:#e8f2e4; --dim:#93a89a; --amber:#ffb545; --green:#47d875;
  --red:#ff5d5d; --blue:#5aa7ff; --yp:#ffe066;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:"Segoe UI",system-ui,-apple-system,sans-serif;height:100%;}
#app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;
  padding:10px 14px 18px;position:relative;overflow:hidden;}
h1{font-size:20px;margin:2px 0 2px;letter-spacing:.5px;}
.sub{color:var(--dim);font-size:12px;margin-bottom:8px;}
.rail{display:flex;gap:4px;margin:8px 0 10px;}
.rail .ph{flex:1;height:26px;border:1px solid var(--border);border-radius:6px;
  display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--dim);
  background:var(--panel);}
.rail .ph.on{background:var(--panel2);border-color:var(--amber);color:var(--yp);font-weight:700;}
.rail .ph.done{background:#1d3a26;border-color:var(--green);color:var(--green);}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:8px 10px;}
.stat .lbl{font-size:11px;color:var(--dim);display:flex;justify-content:space-between;}
.stat .lbl b{color:var(--ink);}
.bar{height:8px;background:#0a120c;border-radius:4px;margin-top:5px;overflow:hidden;}
.bar i{display:block;height:100%;border-radius:4px;transition:width .5s ease,background .3s;}
#card{background:var(--panel2);border:1px solid var(--border);border-radius:12px;
  padding:14px;flex:1;animation:in .35s ease;}
@keyframes in{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.tag{display:inline-block;font-size:10px;text-transform:uppercase;letter-spacing:1px;
  color:var(--amber);border:1px solid var(--amber);border-radius:4px;padding:2px 7px;margin-bottom:8px;}
.q{font-size:16px;line-height:1.45;margin:6px 0 12px;font-weight:600;}
.opt{display:block;width:100%;text-align:left;background:var(--panel);color:var(--ink);
  border:1px solid var(--border);border-radius:9px;padding:11px 12px;margin:7px 0;
  font-size:14px;line-height:1.4;cursor:pointer;}
.opt:active{transform:scale(.985);}
.opt:hover{border-color:var(--amber);}
.result{display:none;background:#0e1c14;border:1px solid var(--border);border-radius:10px;
  padding:12px;margin-top:10px;}
.result .delta{margin:8px 0;font-size:13px;}
.result .fact{font-size:12.5px;color:var(--yp);border-top:1px dashed var(--border);
  padding-top:8px;margin-top:8px;line-height:1.45;}
.btn{display:block;width:100%;text-align:center;background:var(--amber);color:#111;
  border:none;border-radius:9px;padding:13px;font-size:15px;font-weight:700;margin-top:12px;cursor:pointer;}
.btn.grey{background:var(--panel2);color:var(--ink);border:1px solid var(--border);}
#panic{position:fixed;inset:0;background:#000c;display:none;z-index:50;align-items:center;justify-content:center;flex-direction:column;}
#panic .pp{font-size:34px;}
#panic .pt{font-size:22px;font-weight:800;color:var(--red);margin:10px 0 4px;}
#panic .ps{color:var(--dim);font-size:13px;}
#panic .btn{max-width:280px;}
.endscore{text-align:center;padding:16px 0;}
.endscore .big{font-size:26px;font-weight:800;}
.endscore .verdict{font-size:16px;margin:10px 0 4px;font-weight:700;}
.statrow{display:flex;justify-content:space-between;font-size:14px;padding:6px 0;border-bottom:1px dashed var(--border);}
.foot{color:var(--dim);font-size:10.5px;margin-top:12px;text-align:center;line-height:1.5;}
</style>
</head>
<body>
<div id="app">
  <h1>⚕ OPSROOM <span style="color:var(--amber)">TB</span></h1>
  <div class="sub">Kawal Wabak — rawatan &amp; pembendungan ~ 10–15 min</div>
  <div class="rail" id="rail"></div>
  <div class="stats" id="stats"></div>
  <div id="card"></div>
  <div class="foot" id="foot"></div>
</div>
<div id="panic">
  <div class="pp">🚨</div>
  <div class="pt">KETUA PEGAWAI!</div>
  <div class="ps">Dia lalu depan bilik gerakan. Tarik nafas. Semua nampak normal.</div>
  <button class="btn" id="panicBack">Whew… OK. Balik kerja.</button>
</div>
<script>
"use strict";
/* ============ DATA ============ */
const P = { // player state
  stam:6, stamMax:6, backlog:0, backlogMax:7, spread:0, trust:3, trustMax:5,
  cases:0, phase:0, turn:0, score:0, log:[], playMode:'intro', good:0, answered:0, complexDone:false
};
const PHASES=[
 {name:"SURVEILLANCE", short:"SURV", icon:"📡", goal:"Kes dilaporkan; beban data dikuasai.",
  desc:"Malam itu, 3 notifikasi TB masuk dalam sistem. Bilik gerakan kau buka.", content:phase1},
 {name:"ACTIVE CASE DETECTION", short:"ACD", icon:"🔍", goal:"Cari kes di luar simptom — kawasan tumpuan.",
  desc:"Surveillance kata ada kluster. Masa untuk kerja lapangan.", content:phase2},
 {name:"CONTACT TRACING", short:"TRACE", icon:"🕸", goal:"Kesan kontak, rawat, tutup rantaian.",
  desc:"Kes index dah jumpa. Sekarang, siapa yang terdedah?", content:phase3}
];
let D = [];   // current phase decisions
let Q = 0;    // index in phase
let emgQ = []; // emergency queue
let inFlow=false;

/* ============ CORE ============ */
const $=s=>document.querySelector(s);
function setStat(k,v){P[k]=Math.max(0,Math.min(P[k+"Max"]??v*2,v));}
function log(s){P.log.push(s);}
function renderStats(){
  const bars=[
    ["TEAM STAMINA",P.stam,P.stamMax, P.stam<=2?"var(--red)":"var(--green)"],
    ["TRACING BACKLOG",P.backlog,P.backlogMax, P.backlog>=5?"var(--red)":"var(--amber)"],
    ["COMMUNITY SPREAD",P.spread,100, P.spread>=70?"var(--red)":"var(--red)"],
    ["COMMUNITY TRUST",P.trust,P.trustMax, P.trust<=1?"var(--red)":"var(--blue)"],
  ];
  $("#stats").innerHTML=bars.map(b=>`
    <div class="stat"><div class="lbl"><span>${b[0]}</span><b>${b[1]}/${b[2]}</b></div>
    <div class="bar"><i style="width:${b[1]/b[2]*100}%;background:${b[3]}"></i></div></div>`).join("");
  const rh=PHASES.map((p,i)=>`<div class="ph ${i<P.phase?"done":i===P.phase?"on":""}">${p.icon} ${p.short}</div>`).join("");
  $("#rail").innerHTML=rh;
}
function checkGameOver(mode){
  if(P.stam<=0) return gameOver("TEAM RUNTUH","Staminanya habis. Tiada siapa yang boleh turun padang. Wabak lepas tangan.","Team collapsed — no one left for fieldwork.",0);
  if(P.backlog>=P.backlogMax) return gameOver("BACKLOG!","Rantaian kontak putus. Kes kedua muncul sebelum kontak indeks dikesan.","Tracing backlog overflowed — chain broken.",0);
  if(P.spread>=100) return gameOver("WABAK TAK TERKAWAL","Penyebaran dah melampaui kapasiti bilik gerakan.","Outbreak out of control.",0);
  if(P.trust<=0) return gameOver("KOMUNITI TAK PERCAYA","ACD diboikot. Penduduk enggan diskrin.","Community trust collapsed — screening refused.",1);
  return false;
}
function gameOver(title,msg,en,partial){
  P.playMode="over";
  $("#card").innerHTML=`
  <div class="endscore">
    <div class="big">${title}</div>
    <div class="verdict" style="color:var(--red)">❌ WABAK TAK DIKAWAL</div>
    <div class="sub">${msg}<br><i>${en}</i></div>
    ${renderScoreRows()}
    <button class="btn grey" onclick="location.reload()">Cuba Lagi</button>
  </div>`;
  $("#foot").textContent="Latihan konsep untuk pendidikan — bukan dokumen operasi MOH.";
}
function win(){
  P.playMode="over";
  const perfect=P.spread<30?"SEMPURNA":"TERKAWAL";
  $("#card").innerHTML=`
  <div class="endscore">
    <div class="big">✅ OUTBREAK ${perfect}</div>
    <div class="verdict" style="color:var(--green)">WABAK DIKAWAL — index case ditemui, rantaian tutup.</div>
    <div class="sub">${P.spread<30?"Semua langkah hampir optimum. Bilik gerakan patut dapat teh tarik. 🫖":"Ada ruang memperbaiki — tapi komuniti selamat."}</div>
    ${renderScoreRows()}
    <button class="btn" onclick="location.reload()">Main Lagi</button>
  </div>`;
  $("#foot").textContent="Latihan konsep untuk pendidikan — bukan dokumen operasi MOH.";
}
function renderScoreRows(){
  const pct=P.answered? Math.round(P.good/P.answered*100):0;
  return `<div class="statrow"><span>Kes dikesan</span><b>${P.cases}</b></div>
  <div class="statrow"><span>Keputusan optimum</span><b>${P.good}/${P.answered} (${pct}%)</b></div>
  <div class="statrow"><span>Backlog kontak baki</span><b>${P.backlog}/${P.backlogMax}</b></div>
  <div class="statrow"><span>Penyebaran akhir</span><b>${P.spread}%</b></div>`;
}
/* ============ DECISIONS ============ */
function mkD(obj){D=obj;Q=0;}
function showDecision(){
  if(checkGameOver()) return;
  if(Q>=D.length){ phaseClear(); return; }
  const d=D[Q];
  $("#card").innerHTML=`
    <span class="tag">${d.tag??"KEPUTUSAN"}</span>
    <div class="q">${d.q}</div>
    ${d.opts.map((o,i)=>`<button class="opt" data-i="${i}">${o.t}</button>`).join("")}`;
  Array.from(document.querySelectorAll(".opt")).forEach(b=>{
    b.onclick=()=>choose(b.dataset.i);
  });
}
function choose(i){
  const d=D[Q]; const o=d.opts[i];
  Q++;
  P.answered++; if(o.good) P.good++;
  // apply effects
  const fx=o.fx||{};
  P.stam=Math.max(0,P.stam+(fx.stam??0));
  P.backlog=Math.max(0,Math.min(P.backlogMax,P.backlog+(fx.backlog??0)));
  P.spread=Math.max(0,Math.min(100,P.spread+(fx.spread??0)));
  P.trust=Math.max(0,Math.min(P.trustMax,P.trust+(fx.trust??0)));
  P.cases+=fx.cases??0;
  let eff=[];
  if(fx.spread) eff.push(`<span style="color:var(--red)">🔥 Spread ${fx.spread>0?"+":"−"}${Math.abs(fx.spread)}</span>`);
  if(fx.backlog) eff.push(`<span style="color:var(--amber)">📋 Backlog ${fx.backlog>0?"+":"−"}${Math.abs(fx.backlog)}</span>`);
  if(fx.stam) eff.push(`<span style="color:var(--green)">🔋 Stamina ${fx.stam>0?"+":"−"}${Math.abs(fx.stam)}</span>`);
  if(fx.trust) eff.push(`<span style="color:var(--blue)">🤝 Trust ${fx.trust>0?"+":"−"}${Math.abs(fx.trust)}</span>`);
  if(fx.cases) eff.push(`<span style="color:var(--yp)">🧪 +${fx.cases} kes</span>`);
  renderStats();
  $("#card").innerHTML=`
    <span class="tag">${o.good?"✓ BETUL":"✗ KESAN"}</span>
    <div class="q" style="font-size:14px">${o.why||o.t}</div>
    <div class="result" style="display:block">
      <div class="delta">${eff.join(" &nbsp;·&nbsp; ")}</div>
      <div class="fact">💡 ${d.fact}</div>
      <button class="btn" id="nxt">Teruskan →</button>
    </div>`;
  $("#nxt").onclick=()=>{ maybeEmergency(showNext); };
}
function showNext(){
  if(Q>=D.length){ phaseClear(); return; }
  showDecision();
}
function maybeEmergency(cb){
  const ici=emgQ;
  if(ici.length && Math.random()<0.5){
    const e=ici.shift();
    // emergency asks a quick decision
    P.stam=Math.max(0,P.stam+e.stam);
    P.backlog=Math.max(0,Math.min(P.backlogMax,P.backlog+e.backlog));
    P.spread=Math.max(0,Math.min(100,P.spread+e.spread));
    P.trust=Math.max(0,Math.min(P.trustMax,P.trust+e.trust));
    renderStats();
    $("#card").innerHTML=`
      <span class="tag" style="color:var(--red);border-color:var(--red)">⚠️ KEJADIAN</span>
      <div class="q" style="font-size:14.5px">${e.t}</div>
      <div class="result" style="display:block">
        <div class="delta">${e.note}</div>
        <button class="btn" id="nxtE">Urus →</button>
      </div>`;
    $("#nxtE").onclick=()=>{if(checkGameOver())return;cb();};
    return;
  }
  cb();
}
function phaseClear(){
  if(checkGameOver()) return;
  const nd=P.phase+1;
  if(nd>=PHASES.length){
    if(P.complexDone){ win(); } else { complexCase(); }
    return;
  }
  breakRoom(nd);
}
function breakRoom(nd){
  $("#card").innerHTML=`
    <span class="tag">REHAT — ${PHASES[nd].icon} seterusnya</span>
    <div class="q">Rehat sekejap sebelum fasa ${PHASES[nd].name}?</div>
    <div class="sub">Pilih bijak. Bilik gerakan tak berhenti — panggilan tetap masuk.</div>
    <button class="opt" id="brTea">🫖 Teh Tarik — stamina +2, tapi telefon berdering (+1 backlog)</button>
    <button class="opt" id="brWork">⚡ Teruskan kerja — tiada perubahan</button>`;
  $("#brTea").onclick=()=>{ P.stam=Math.min(P.stamMax,P.stam+2); P.backlog=Math.min(P.backlogMax,P.backlog+1); renderStats(); P.phase=nd; loadPhase(); };
  $("#brWork").onclick=()=>{ P.phase=nd; loadPhase(); };
}
function loadPhase(){
  const p=PHASES[P.phase];
  p.content(); // load this phase's decisions into D
  $("#card").innerHTML=`
    <span class="tag">FASA ${P.phase+1} / 3</span>
    <div class="q">${p.icon} ${p.name}</div>
    <div class="sub" style="margin-bottom:8px">${p.desc}<br><b>Matlamat:</b> ${p.goal}</div>
    <button class="btn" id="startPh">Buka Operasi →</button>`;
  $("#startPh").onclick=()=>{ showDecision(); };
  renderStats();
}
/* ============ COMPLEX CASE: MDR-TB ============ */
function complexCase(){
  P.playMode="final"; P.complexDone=true;
  mkD([{
    tag:"KOMPLEKS — MDR-TB", q:"Kes baru: suspek MDR-TB (tak respons DOT rutin). Xpert dah keluar: rifampicin-resistant. Tindakan pertama?",
    fact:"MDR-TB perlu rejimen khusus (bedaquiline/delamanid regimen) + pengasingan mengikut garis panduan; rawatan DOT rutin TIDAK akan sembuh.",
    opts:[
      {t:"Tukar kepada rejimen anti-TB baris kedua ikut garis panduan kebangsaan",fx:{spread:-8,stam:0},good:1,why:"Betul — MDR kena baris kedua, bukan pandai-pandai ubah sendiri."},
      {t:"Teruskan DOT baris pertama, tambah dos sahaja",fx:{spread:14,backlog:2,stam:-1},good:0,why:"Dos tambah tak bunuh MDR. Rantaian makin merebak."},
      {t:"Hantar balik kes ke rumah, suruh rehat",fx:{spread:20,trust:-1},good:0,why:"MDR yang tak diasingkan = bom jangka dalam komuniti."}
    ]
  },{
    tag:"KOMPLEKS — KONTAK", q:"Isteri & 2 anak kontak rapat. Anak bongsu 4 tahun, BCG dah dapat. Langkah?",
    fact:"Kontak kanak(&lt;5 tahun) + BCG masih perlu assessment & TPT (latent TB treatment) — BCG tak jamin perlindungan penuh.",
    opts:[
      {t:"Assess semua 3; beri TPT kepada yang layak selepas tolak TB aktif",fx:{spread:-10,cases:1,trust:1},good:1,why:"Tepat — TPT untuk latent, bukan rawat aktif; anak kecil prioriti."},
      {t:"BCG dah ada — tak perlu apa-apa",fx:{spread:16,trust:-1},good:0,why:"BCG = separa. Latent tetap perlu TPT."},
      {t:"Isytihar pandemik — tutup sekolah serta-merta",fx:{spread:-6,trust:-2},good:0,why:"Terlampau. Tutup sekolah masa wabak TB perlu bukti penularan sekolah, bukan panik."}
    ]
  },{
    tag:"KOMPLEKS — KESIMPULAN", q:"Rantaian masih ada 1 kontak hilang di tapak pembinaan. Baki 1 hari sebelum pasukan tamat tempoh. Keputusan?",
    fact:"Contact tracing dianggap lengkap bila kebanyakan kontak dikenal & diuruskan — 'kontak hilang' perlu usaha berterusan, bukan serah kalah.",
    opts:[
      {t:"Sepasukan kecil buat lawatan tapak sekali lagi + senarai pekerja",fx:{spread:-8,stam:-1,backlog:-2},good:1,why:"Lawatan susulan = kerja asas ACD. Satu hari lagi, satu rantaian lagi putus."},
      {t:"Tutup fail — 1 kontak je, risiko rendah",fx:{spread:12,backlog:1},good:0,why:"1 kontak hilang boleh jadi 1 kluster baru. Fail tak 'hampir-cukup'."},
      {t:"Hantar WhatsApp amaran umum sahaja",fx:{spread:6,trust:0},good:0,why:"Amaran umum ≠ tracing. Nama & lokasi dikenal pasti secara sulit."}
    ]
  }]);
  showDecision();
}
/* ============ PHASE CONTENT ============ */
function phase1(){ // SURVEILLANCE
  mkD([
   {tag:"PENYIASATAN", q:"Notifikasi masuk: TB paru-paru, pekerja kilang, kawasan tumpuan. Apa dulu?",
    fact:"Pengesahan cepat (bakteriologi: Xpert MTB/RIF / kultur) + notifikasi rasmi dalam 24 jam adalah asas kawalan TB.",
    opts:[
      {t:"Sahkan kes (Xpert/sputum) & hantar notifikasi lengkap",fx:{cases:1,spread:-4},good:1,why:"Betul — bukan TB kalau tak sah. Data dulu, panik kemudian."},
      {t:"Terus maklumkan kepada media",fx:{spread:4,trust:-1},good:0,why:"Media sebelum pengesahan = fitnah & kepercayaan komuniti runtuh."},
      {t:"Letak dalam pending; boleh tunggu minggu depan",fx:{backlog:2,spread:4},good:0,why:"Tangguh notifikasi = kes berjangkit terus beredar."}
    ]},
   {tag:"BEBAN DATA", q:"3 jururawat kena overtime kunci data. Sistem lama. Cara paling pintar?",
    fact:"Beban surveillance perlu diurus — data yang tak masuk = kes yang tak nampak.",
    opts:[
      {t:"Dahulukan 4 medan kritikal (ID, alamat, klinik, keputusan); selebihnya susulan",fx:{backlog:-1,stam:0},good:1,why:"Betul — guna masa pasukan pada data yang ubah tindakan."},
      {t:"Paksa semua lengkap penuh sebelum setiap entri diterima",fx:{backlog:2,stam:-1},good:0,why:"Perfect-gate membunuh semangat & lambatkan pengesanan."},
      {t:"Suruh pasukan kerja 3 jam lagi setiap malam",fx:{stam:-2,backlog:-1},good:0,why:"Stamina hancur menjelang fasa ACD yang lebih penting."}
    ]},
   {tag:"LAB QUEUE", q:"Xpert mesin 1 je untuk 4 daerah, 40 spekimen menunggu. Susun atur?",
    fact:"Ujian perlu diprioritikan: simptomatik kontak kes index & kumpulan berisiko tinggi duluun.",
    opts:[
      {t:"Prioriti: kontak kes index + kanak-kanak & orang OKU, kemudian rutin",fx:{backlog:-1,spread:-3},good:1,why:"Tepat — kontak = kadar jangkitan tertinggi."},
      {t:"Sama rata — ikut masa masuk je",fx:{backlog:1,spread:2},good:0,why:"Sama rata ≠ adil. Kontak perlu lebih cepat."},
      {t:"Hantar semua ke makmal luar negeri",fx:{stam:-1,backlog:2},good:0,why:"Logistik luar = keputusan lambat = kes hilang dari radar."}
    ]},
   {tag:"KLUSTER MALAM", q:"Pukul 11 malam, 2 kes baharu dari rumah kongsi sama. Bilik gerakan?",
    fact:"Kluster malam = 'hotspot' — ACD keesokan pagi, sebelum pekerja bertabur.",
    opts:[
      {t:"Tanda kluster dalam sistem; rancang ACD awal pagi di rumah kongsi",fx:{spread:-5},good:1,why:"Tepat — sasarkan sebelum penghuni bergerak ke kerja."},
      {t:"Biar — operator nak balik, boleh buat esok petang",fx:{backlog:1,spread:7},good:0,why:"6 jam lewat = 6 jam berjangkit."},
      {t:"Isytihar darurat district",fx:{trust:-2,spread:-2},good:0,why:"Darurat untuk 2 kes = hilang kredibiliti."}
    ]},
   {tag:"SURVEILLANCE BURDEN", q:"2,400 rekod TB negara vs 12 kakitangan. Beban 'latent data' — apa maksudnya?",
    fact:"Beban surveillance = data yg dikumpul tapi tak diurus jadi tindakan. Tugas bilik gerakan: ubah data → keputusan.",
    opts:[
      {t:"Audit ringkas: kes mana yang belum di-hubungi & terlepas rawatan?",fx:{cases:1,backlog:-1,spread:-4},good:1,why:"Betul — surveillance yang tak bertindak cuma 'data tidur'."},
      {t:"Sambung kumpul sahaja — tugas makluman bukan kami",fx:{spread:6},good:0,why:"Bilik gerakan wujud sebab data mesti jadi tindakan."},
      {t:"Buang rekod lama untuk kurangkan beban",fx:{backlog:-1,spread:10},good:0,why:"Memadam data surveillance = hilang jejak epidemiologi."}
    ]}
  ]);
}
function phase2(){ // ACD
  mkD([
   {tag:"ACD", q:"Sasaran ACD pertama esok pagi: rumah kongsi pekerja kilang. Apa yang paling produktif?",
    fact:"ACD = cari kes di luar yang datang sendiri: skrin gejala (batuk >2 minggu), kumpulan berisiko (kakitangan kongsi, diabetes, PLHIV).",
    opts:[
      {t:"Skrin bergejala + ambil sputum untuk semua penghuni, fokus batuk >2 minggu",fx:{cases:2,spread:-6},good:1,why:"Betul — itu definisi ACD."},
      {t:"Ambil darah semua untuk ujian kekebalan",fx:{stam:-1,trust:0},good:0,why:"Ujian darah untuk TB akut bukan skrin pertama — sputum/Xpert."},
      {t:"Sekat pintu kilang, tak bagi sesiapa keluar",fx:{trust:-3,spread:-4},good:0,why:"Kurungan = takhta perundangan & hilang kerjasama."}
    ]},
   {tag:"KERJA LAPANGAN", q:"Pasukan sampai rumah kongsi: 14 orang, 2 batuk. 1 enggan beri sputum. Langkah?",
    fact:"Enggan diskrin biasa. Kunci: komunikasi risikoko + jaminan kerahsiaan; paksaan terakhir.",
    opts:[
      {t:"Ceramah ringkas 10 minit + janji kerahsiaan, kekal sabar",fx:{trust:1,spread:-3,cases:1},good:1,why:"Betul — kepercayaan = alat ACD paling ampuh."},
      {t:"Paksa ambil sputum — kita ada autoriti",fx:{trust:-2,spread:2},good:0,why:"Paksaan = boycott & kes hilang."},
      {t:"Tulis 'refused' & teruskan",fx:{spread:8,backlog:1},good:0,why:"Refusal tanpa susulan = kontak hilang kekal."}
    ]},
   {tag:"KERJA LAPANGAN 2", q:"Dah 3 jam di lapangan, 2 lagi rumah nak visit; musim hujan. Stamina pasukan separuh. Keputusan?",
    fact:"Kerja lapangan: baki stamina perlu diurus — jangan biar pasukan 'terbakar' sebelum fasa tracing.",
    opts:[
      {t:"Rota: 2 orang sambung, selebihnya rehat sekejap",fx:{stam:1,spread:-4},good:1,why:"Betul — pacing pasukan = strategi, bukan lemah."},
      {t:"Serbu semua rumah sekali gus malam ini",fx:{stam:-2,spread:-6},good:0,why:"Esok takde pasukan untuk fasa paling kritikal."},
      {t:"Batal, sambung minggu depan",fx:{spread:12,backlog:2},good:0,why:"ACD yang dibatalkan = kluster merebak senyap."}
    ]},
   {tag:"LAB + TITIP", q:"Sputum 6 orang positif (5 sensitive, 1 rifampicin-resistant). Mesej utama ke komuniti?",
    fact:"Xpert MTB/RIF satu ujian bagi diagnosis + status rintangan — rawatan berbeza ikut keputusan.",
    opts:[
      {t:"Mesej: 'Dapat rawatan percuma & berkesan; datang jika batuk lama' — tanpa nama pesakit",fx:{trust:1,spread:-6},good:1,why:"Tepat — sulit + jangan stigmatize."},
      {t:"Mesej: 'ADA KES TB DI RUMAH KONGSI ANDA — SIAPAKAH? '",fx:{spread:-8,trust:-3},good:0,why:"Naming = stigma & kontak tak nak keluar."},
      {t:"Diam sahaja — elak panik",fx:{spread:8},good:0,why:"Senyap = spekulasi & kes tak datang."}
    ]},
   {tag:"ACD CLOSE", q:"Petang: 30 diskrin, 3 kes baru (2 sputum+, 1 klinikal). Semua dalam rawatan minggu ini?",
    fact:"Semua kes TB mesti mula rawatan & dilaporkan — 'lost to follow-up' adalah kegagalan kawalan.",
    opts:[
      {t:"Rujuk klinik TB: mula DOT & notifikasi lengkap hari ini",fx:{backlog:-1,spread:-7,cases:1},good:1,why:"Betul — diagnosis tanpa rawatan = kosong."},
      {t:"Beri ubat & suruh balik datang bila sakit lagi",fx:{backlog:2,spread:8},good:0,why:"Tanpa DOT/rujukan, kebarangkalian putus rawatan tinggi."},
      {t:"Ajak mereka tolong cari lagi pesakit sebagai balasan",fx:{trust:-1,spread:3},good:0,why:"Pesakit bukan volunteer. Peranan mereka: sembuh."}
    ]}
  ]);
}
function phase3(){ // CONTACT TRACING
  mkD([
   {tag:"INDEX CASE", q:"Kes index ditemui: penghuni rumah kongsi, batuk sejak 2 bulan, tinggal dengan 5 orang + kerja kilang 40 pekerja. Jejaki?",
    fact:"Contact tracing: kenal pasti kontak rapat (isi rumah, tempat kerja) & prioriti oleh tahap pendedahan.",
    opts:[
      {t:"Senarai kontak: 5 isi rumah + rapat kerja; assessment dalam 7 hari",fx:{backlog:-2,spread:-8,cases:1},good:1,why:"Betul — 7 hari sasaran; kerja pantas tapi tertib."},
      {t:"Trace seluruh 40 pekerja dulu, rumah kemudian",fx:{backlog:2,stam:-1},good:0,why:"Urutan salah — kontak paling rapat (isi rumah) paling tinggi risiko."},
      {t:"Trace hanya yang bergejala sahaja",fx:{spread:10},good:0,why:"Latent TB tak bergejala — kau akan lepaskan bakal kes."}
    ]},
   {tag:"HOUSEHOLD", q:"Isteri kes index positif sputum; 3 anak (6,9 & 12 tahun) — assessment perlu cepat. Rutin?",
    fact:"Kanak-kanak kontak <5 tahun = kelompok paling tinggi risiko TB aktif — dahulukan assessment & TPT.",
    opts:[
      {t:"Assess anak-anak sama hari + TPT untuk yang layak",fx:{spread:-9,cases:1,backlog:-1},good:1,why:"Betul — usia muda = risiko tinggi."},
      {t:"Anak takde gejala — tak payah",fx:{spread:13,trust:-1},good:0,why:"TB kanak selalunya asimtomatik pada mulanya."},
      {t:"Hantar anak tinggal dengan nenek sampai selesai",fx:{spread:5,trust:-1},good:0,why:"Pindah tak sembuh; kontak baru + nenek terdedah."}
    ]},
   {tag:"WORKPLACE", q:"Kilang 40 pekerja: skrin 34, 6 positif (4 punya simptom). 6 pesakit dalam 1 bilik kongsi. Isu kongsi?",
    fact:"Kongsi bilik = persekitaran berisiko tinggi; pengudaraan & ruang kongsi perlu perhatian kawalan persekitaran.",
    opts:[
      {t:"Rujuk semua 6 untuk rawatan; tulis senarai kontak kongsi bilik & fokuskan ACD ulangan",fx:{backlog:-2,spread:-10,cases:2},good:1,why:"Betul — kongsi bilik = tempat penularan laju."},
      {t:"Rawat 4 bergejala sahaja; 2 tanpa gejala biar",fx:{spread:11},good:0,why:"Tanpa gejala ≠ tanpa TB. Xpert positif = kes."},
      {t:"Majikan boleh buang 6 pekerja tu",fx:{trust:-3,spread:6},good:0,why:"Pecat = pesakit hilang dari pengawasan, stigma melatah."}
    ]},
   {tag:"RANTAI BERGESER", q:"Index malam tadi balik kampung hujung minggu (2 jam bas, tinggal 1 malam). Jejak kampung?",
    fact:"Kontak di luar tempat tinggal perlu dipertimbang ikut tempoh & kekerapan pendedahan — bukan semua 'kontak' sama.",
    opts:[
      {t:"Koordinat dengan pasukan daerah sana: senarai kontak kampung (isi rumah + jiran rapat)",fx:{backlog:-1,spread:-7},good:1,why:"Betul — silang daerah = kerja bersama, bukan bertindih."},
      {t:"Kampung jauh — tak relevan",fx:{spread:9},good:0,why:"TB tak ikut sempadan daerah."},
      {t:"Notis awam kampung: 'Sesiapa naik bas 2 jam balik lalu dilapor'",fx:{trust:-2,spread:2},good:0,why:"Stigma balik kampung = orang tak nak bagi maklumat."}
    ]},
   {tag:"TUTUP RANTAI", q:"Semua kontak dikenal pasti & diuruskan; rawatan DOT berjalan. Komuniti tanya: 'Kapan boleh tutup fail?'",
    fact:"Penutupan wabak: rantaian penularan berhenti — tiada kes baharu dalam tempoh inkubasi + semua kontak diuruskan dengan betul.",
    opts:[
      {t:"Terangkan kriteria penutupan & kekal surveillance 2 kitaran inkubasi",fx:{spread:-8,trust:1},good:1,why:"Betul — tutup dengan bukti, bukan dengan harapan."},
      {t:"Umum selamat sekarang juga",fx:{spread:8},good:0,why:"Umum awal = kes tertinggal jadi kluster baru."},
      {t:"Teruskan trak penuh selamanya",fx:{stam:-2,trust:0},good:0,why:"Skala surveillance perlu naik/turun ikut risiko — bukan selamanya penuh."}
    ]}
  ]);
}

 {t:"Jururawat kanan demam — pasukan kurang seorang hari ini.",note:"Stamina −1, Backlog +1",stam:-1,backlog:1,spread:0,trust:0},
];
/* ============ BOOT ============ */
function start(){
  P.playMode="play";
  emgQ=EMG.slice().sort(()=>Math.random()-0.5);
  P.phase=0; loadPhase(); renderStats();
}
function storyIntro(){
  $("#card").innerHTML=`
    <span class="tag">BILIK GERAKAN — 01:00</span>
    <div class="q">Dua belas jam. Satu daerah. TB merebak senyap dari rumah kongsi ke kilang ke kampung.</div>
    <div class="sub">Awak pegawai kesihatan awam bertugas. Sebelum subuh, bilik gerakan kau buka. 
    Surveillance dulu. Lepas tu ACD. Lepas tu tracing. Setiap keputusan ada harga — backlog kontak yang tak dikesan, 
    spread yang naik, stamina pasukan yang cair.</div>
    <button class="btn" id="go">Buka Bilik Gerakan 🚨</button>`;
  $("#go").onclick=()=>{
    $("#panicBack").onclick=()=>$("#panic").style.display="none";
    // panic button: small floating? use long-press? simple: a footer link
    start();
  };
}
window.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#panic").style.display==="none"&&P.playMode==="play"){$("#panic").style.display="flex";}});
// attach warden button
setTimeout(()=>{
  const b=document.createElement("button");
  b.id="wardenBtn"; b.textContent="🚨"; b.style.cssText="position:fixed;bottom:14px;right:14px;width:46px;height:46px;border-radius:50%;background:#3a1616;border:1px solid var(--red);color:var(--red);font-size:18px;z-index:40;cursor:pointer;";
  b.onclick=()=>{$("#panic").style.display="flex";};
  document.body.appendChild(b);
  $("#panicBack").onclick=()=>$("#panic").style.display="none";
},100);
storyIntro();
